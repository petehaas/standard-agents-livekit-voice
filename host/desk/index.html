<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harbor Goods · Order support</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --ink: #f4f1ea;
      --muted: #9a958c;
      --line: rgba(244, 241, 234, 0.14);
      --card: #12141b;
      --amber: #e8a15a;
      --cyan: #7fd0d6;
      --green: #8fbf9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 50% 30%, rgba(80, 70, 50, 0.18), transparent 46%),
        var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      min-height: 100%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px 36px 0;
    }
    .brand {
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .brand span { color: var(--muted); font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-left: 12px; white-space: nowrap; }
    #status { color: var(--muted); font-size: 14px; }
    main {
      min-height: calc(100% - 72px);
      display: grid;
      place-items: center;
      padding: 24px 24px 48px;
    }
    .desk { width: min(1040px, 100%); }
    .stage {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      justify-items: center;
      align-items: center;
    }
    .stage.has-order { grid-template-columns: minmax(260px, 1fr) minmax(300px, 420px); }
    @media (max-width: 760px) {
      .stage.has-order { grid-template-columns: 1fr; }
      header { padding: 20px 20px 0; }
    }
    .orb-wrap { position: relative; width: min(420px, 78vw); aspect-ratio: 1; }
    .orb, video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: transparent;
    }
    video { display: none; }
    video.on { display: block; }
    .placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 48%, #f7f4ff 0 7%, rgba(186, 198, 235, 0.55) 16%, rgba(72, 84, 150, 0.28) 38%, transparent 68%);
    }
    .placeholder.off { display: none; }
    .card {
      display: none;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0 0 18px;
      overflow: hidden;
    }
    .card.on { display: block; }
    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      height: auto;
      object-fit: cover;
      background: #1c1e26;
    }
    .card-body { padding: 16px 20px 0; }
    .who { color: var(--muted); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
    .item {
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-size: 28px;
      line-height: 1.15;
      margin: 10px 0 4px;
    }
    .detail { color: var(--muted); font-size: 14px; }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 14px;
      font-size: 15px;
    }
    .order-no { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
    .facts { display: grid; gap: 6px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .facts strong { color: var(--ink); font-weight: 550; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      background: rgba(232, 161, 90, 0.16);
      color: var(--amber);
    }
    .pill.shipped { background: rgba(127, 208, 214, 0.14); color: var(--cyan); }
    .pill.delivered { background: rgba(143, 191, 154, 0.16); color: var(--green); }
    .steps { display: flex; gap: 8px; margin: 22px 0 14px; }
    .step { flex: 1; }
    .bar { height: 3px; border-radius: 99px; background: rgba(244, 241, 234, 0.12); margin-bottom: 8px; }
    .step.done .bar, .step.current .bar { background: var(--amber); }
    .step.shipped.done .bar, .step.shipped.current .bar { background: var(--cyan); }
    .step.delivered.done .bar, .step.delivered.current .bar { background: var(--green); }
    .step span { display: block; font-size: 11px; color: var(--muted); }
    .step.current span { color: var(--ink); }
    .when { font-size: 15px; }
    .actions { margin-top: 8px; display: flex; justify-content: center; }
    button {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: #16140f;
      font: inherit;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button:disabled { opacity: 0.5; cursor: default; }
    /* ── Changes, tracking, confirmation ── */
    .updated {
      display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 9px 12px; border-radius: 10px;
      background: rgba(143, 191, 154, 0.14); color: var(--green); font-size: 14px; animation: rise 0.4s ease-out;
    }
    .note { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .note strong { color: var(--ink); font-weight: 550; }
    .return-code {
      margin-top: 14px; padding: 14px; border-radius: 12px; text-align: center;
      background: rgba(244, 241, 234, 0.05); border: 1px dashed rgba(244, 241, 234, 0.25);
    }
    .return-code b { display: block; font-size: 26px; letter-spacing: 0.18em; font-variant-numeric: tabular-nums; margin: 4px 0; }
    .return-code span { color: var(--muted); font-size: 12px; }
    .map { display: block; width: 100%; height: auto; background: radial-gradient(ellipse at 50% 40%, #171a24, #0e1016); }
    .map .land { fill: rgba(244, 241, 234, 0.045); stroke: rgba(244, 241, 234, 0.16); stroke-width: 0.8; }
    .map .grid { fill: url(#dots); }
    .map .route-todo { fill: none; stroke: rgba(244, 241, 234, 0.35); stroke-width: 1.6; stroke-dasharray: 3 4; }
    .map .route-done { fill: none; stroke: var(--amber); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .map .stop { fill: #0e1016; stroke: rgba(244, 241, 234, 0.6); stroke-width: 1.4; }
    .map .stop.passed { stroke: var(--amber); }
    .map .end { fill: var(--cyan); }
    .map text { fill: var(--muted); font-size: 9px; font-family: "Avenir Next", "Segoe UI", sans-serif; }
    .map text.strong { fill: var(--ink); }
    .map .pulse { fill: var(--amber); opacity: 0.35; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { from { transform: scale(0.6); opacity: 0.55; } to { transform: scale(2.6); opacity: 0; } }
    .track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px; }
    .track-no { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    .eta { font-size: 18px; margin: 6px 0 12px; }
    .scans { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .scan { position: relative; padding: 0 0 12px 20px; font-size: 14px; }
    .scan::before { content: ''; position: absolute; left: 4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: rgba(244, 241, 234, 0.3); }
    .scan::after { content: ''; position: absolute; left: 7px; top: 15px; bottom: -2px; width: 1px; background: var(--line); }
    .scan:last-child::after { display: none; }
    .scan:first-child::before { background: var(--amber); box-shadow: 0 0 0 4px rgba(232, 161, 90, 0.18); }
    .scan .when { font-size: 12px; color: var(--muted); }
    .scan .what { color: var(--ink); }
    .scan .where { color: var(--muted); }
    .confirm {
      margin: 16px 20px 0; padding: 16px; border-radius: 14px;
      background: rgba(232, 161, 90, 0.08); border: 1px solid rgba(232, 161, 90, 0.4);
      animation: rise 0.35s ease-out;
    }
    .confirm h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--amber); }
    .confirm ul { margin: 0 0 10px; padding-left: 18px; font-size: 15px; line-height: 1.5; }
    .confirm p { margin: 0; color: var(--muted); font-size: 13px; }
    .card .confirm + .card-body { opacity: 0.45; }

    /* ── Hint toast ── */
    .toast {
      position: fixed; left: 50%; top: 72px; z-index: 20;
      display: flex; align-items: center; gap: 14px;
      width: max-content; max-width: calc(100vw - 32px);
      padding: 12px 12px 12px 18px; border-radius: 16px;
      background: rgba(18, 20, 27, 0.82); border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transform: translate(-50%, 0); opacity: 1;
      transition: opacity 0.35s ease, transform 0.35s ease;
      animation: toast-in 0.5s 0.4s ease-out both;
    }
    .toast.gone { opacity: 0; transform: translate(-50%, -12px); pointer-events: none; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, -12px); } }
    .toast-icon {
      flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(232, 161, 90, 0.14); color: var(--amber);
    }
    .toast-text { font-size: 14px; line-height: 1.35; }
    .toast-text small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
      padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink);
    }
    .toast-close {
      flex: none; background: transparent; color: var(--muted); padding: 6px; width: 30px; height: 30px;
      border-radius: 50%; display: grid; place-items: center; font-size: 18px; line-height: 1;
    }
    .toast-close:hover { color: var(--ink); background: rgba(244, 241, 234, 0.08); }
    @media (max-width: 520px) { .toast { top: 64px; } }

    /* ── Live layer: audio-reactive ring, captions, latency ── */
    .viz { position: absolute; inset: -14%; width: 128%; height: 128%; pointer-events: none; }
    .orb-wrap .placeholder, .orb-wrap video { position: relative; z-index: 1; }
    .mode {
      position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); z-index: 2;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(7, 8, 12, 0.7);
      backdrop-filter: blur(8px); transition: color 0.3s, border-color 0.3s;
    }
    .mode.speaking { color: var(--amber); border-color: rgba(232, 161, 90, 0.45); }
    .mode.listening { color: var(--cyan); border-color: rgba(127, 208, 214, 0.45); }
    .mode.ended { color: var(--muted); border-color: var(--line); }
    .orb-wrap.ended .placeholder, .orb-wrap.ended video { opacity: 0.35; filter: grayscale(0.6); transition: opacity 0.8s, filter 0.8s; }
    .caps {
      width: min(640px, 100%); margin: 30px auto 18px; display: flex; flex-direction: column; gap: 10px;
      min-height: 0; max-height: 220px; overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent, #000 34%);
    }
    .cap { max-width: 82%; padding: 10px 15px; border-radius: 16px; font-size: 16px; line-height: 1.4; animation: rise 0.35s ease-out; }
    .cap.agent { align-self: flex-start; background: rgba(232, 161, 90, 0.10); border: 1px solid rgba(232, 161, 90, 0.22); }
    .cap.caller { align-self: flex-end; background: rgba(127, 208, 214, 0.10); border: 1px solid rgba(127, 208, 214, 0.22); }
    .cap.cut::after { content: ' — interrupted'; color: var(--muted); font-size: 13px; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .latency { display: none; gap: 14px; align-items: baseline; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .latency.on { display: flex; }
    .latency b { color: var(--ink); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .latency b.good { color: var(--green); } .latency b.ok { color: var(--amber); } .latency b.slow { color: #e07a6a; }
    .head-right { display: flex; gap: 22px; align-items: baseline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Harbor Goods <span>Order support</span></div>
    <div class="head-right">
      <div class="latency" id="latency" title="Voice-to-voice: end of your turn to the agent's first audio">
        <span>Response <b id="lat-last">–</b></span><span>avg <span id="lat-avg">–</span></span>
      </div>
      <div id="status">Ready</div>
    </div>
  </header>
  <main>
    <div class="desk">
      <div class="stage" id="stage">
        <div class="orb-wrap">
          <canvas class="viz" id="viz"></canvas>
          <div class="placeholder" id="placeholder"></div>
          <div class="mode" id="mode" hidden>Idle</div>
          <video id="orb" class="orb" autoplay muted playsinline></video>
        </div>
        <article class="card" id="card" aria-live="polite"></article>
      </div>
      <div class="caps" id="caps" aria-live="polite"></div>
      <div class="toast" id="hint" role="status">
        <div class="toast-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg>
        </div>
        <div class="toast-text">
          <small id="hint-lead">Press Start call, then say an order number</small>
          <div class="chips"><span class="chip">111</span><span class="chip">222</span><span class="chip">333</span><span class="chip">444</span><span class="chip">555</span></div>
        </div>
        <button class="toast-close" id="hint-close" type="button" aria-label="Dismiss">&times;</button>
      </div>
      <div class="actions">
        <button id="start" type="button">Start call</button>
        <button id="leave" class="ghost" type="button" hidden>Leave</button>
      </div>
    </div>
  </main>
  <script src="/vendor/livekit-client.umd.js"></script>
  <script>
    const { Room, RoomEvent, Track, createLocalAudioTrack } = LivekitClient;
    const statusEl = document.querySelector('#status');
    const startBtn = document.querySelector('#start');
    const leaveBtn = document.querySelector('#leave');
    const stage = document.querySelector('#stage');
    const card = document.querySelector('#card');
    const video = document.querySelector('#orb');
    const placeholder = document.querySelector('#placeholder');
    const hint = document.querySelector('#hint');
    const hintLead = document.querySelector('#hint-lead');
    const dismissHint = () => hint.classList.add('gone');
    document.querySelector('#hint-close').addEventListener('click', dismissHint);

    const escape = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[ch]);

    // Cards arrive over the `show_card` RPC. `kind` picks the layout.
    let lastOrder = null;

    function showCard(data) {
      if (data.kind === 'tracking') renderTracking(data);
      else if (data.kind === 'confirm') renderConfirm(data);
      else renderOrder(data);
      card.classList.add('on');
      stage.classList.add('has-order');
      dismissHint();
    }

    function toneOf(status) {
      return status === 'shipped' ? 'shipped' : status === 'delivered' ? 'delivered' : 'in_process';
    }

    function orderBody(order) {
      const tone = toneOf(order.status);
      const steps = (order.steps || []).map((step) =>
        `<div class="step ${tone} ${escape(step.state)}"><div class="bar"></div><span>${escape(step.label)}</span></div>`
      ).join('');
      const facts = [
        order.placedLabel ? `<div>Placed <strong>${escape(order.placedLabel)}</strong></div>` : '',
        order.shipsTo ? `<div>Ships to <strong>${escape(order.shipsTo)}</strong></div>` : '',
      ].join('');
      const note = order.instructions ? `<div class="note">Leave it: <strong>${escape(order.instructions)}</strong></div>` : '';
      const ret = order.returnCode
        ? `<div class="return-code"><span>Return code</span><b>${escape(order.returnCode)}</b><span>Drop off at any Parcelway location within 30 days</span></div>`
        : '';
      return `
        <div class="card-body">
          ${order.updated ? `<div class="updated">✓ ${escape(order.updated)}</div>` : ''}
          <div class="who">${escape(order.customerName)} · Order ${escape(order.orderNumber)}</div>
          <div class="item">${escape(order.title || order.item)}</div>
          <div class="detail">${escape(order.detail || '')}</div>
          <div class="meta"><span>Qty ${escape(order.quantity ?? 1)}</span><span>${escape(order.total || '')}</span></div>
          <div class="order-no"><span class="pill ${tone}">${escape(order.returnCode ? 'Return started' : order.statusLabel || '')}</span></div>
          <div class="steps">${steps}</div>
          <div class="when">${escape(order.deliveryLabel || '')}</div>
          <div class="facts">${facts}</div>
          ${note}${ret}
        </div>`;
    }

    function photoOf(order) {
      return typeof order.image === 'string' && /^\/products\/[a-z0-9-]+\.(png|jpe?g|webp)$/.test(order.image)
        ? `<img class="photo" src="${escape(order.image)}" alt="">`
        : '';
    }

    function renderOrder(order) {
      lastOrder = order;
      card.innerHTML = photoOf(order) + orderBody(order);
    }

    function renderConfirm(data) {
      const box = `
        <div class="confirm" role="alert">
          <h3>${escape(data.heading)}</h3>
          <ul>${data.lines.map((line) => `<li>${escape(line)}</li>`).join('')}</ul>
          <p>Say “yes” to confirm, or tell the agent what to change.</p>
        </div>`;
      const sameOrder = lastOrder && lastOrder.orderNumber === data.orderNumber;
      card.innerHTML = box + (sameOrder ? orderBody(lastOrder) : `<div class="card-body"><div class="item">${escape(data.title)}</div></div>`);
    }

    // Contiguous US, coarse. Enough to place the route; not a survey.
    const US = [[-124.7,48.4],[-124.2,42],[-124.4,40.4],[-122.4,37.2],[-120.6,34.6],[-117.1,32.5],[-114.7,32.7],[-111,31.3],[-108.2,31.3],[-106.5,31.8],[-104.5,29.6],[-103,29],[-101.4,29.8],[-99.5,27.5],[-97.4,25.9],[-97.2,27.8],[-94.5,29.5],[-90.6,29.1],[-89.4,30.2],[-88,30.4],[-85,29.7],[-83.8,29.9],[-82.7,27.6],[-81.2,25.1],[-80.1,26.8],[-81.4,30.7],[-79.2,33.2],[-75.5,35.3],[-76.3,37.9],[-74,40.6],[-71.9,41.3],[-70,41.7],[-70.6,43.1],[-67,44.8],[-67.8,47.1],[-69.2,47.4],[-71.5,45],[-75,45],[-76.8,43.6],[-79.1,43.2],[-79,42.7],[-82.5,41.7],[-83.5,42.1],[-82.4,43],[-84.8,45.9],[-83.6,46.1],[-84.6,46.5],[-88.4,48.3],[-95.2,49],[-123.3,49],[-122.8,48.2]];
    const MAP_W = 400, MAP_H = 230;
    const project = ([lon, lat]) => [((lon + 126) / 60) * MAP_W, ((50.5 - lat) / 27) * MAP_H];

    function mapSvg(stops, progress) {
      const pts = stops.map((stop) => project([stop.lon, stop.lat]));
      const land = 'M' + US.map((p) => project(p).map((n) => n.toFixed(1)).join(',')).join('L') + 'Z';
      const line = (list) => list.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' ');
      const whole = Math.floor(progress);
      const frac = progress - whole;
      const done = pts.slice(0, whole + 1);
      let here = pts[Math.min(whole, pts.length - 1)];
      if (whole < pts.length - 1 && frac > 0) {
        const [a, b] = [pts[whole], pts[whole + 1]];
        here = [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
        done.push(here);
      }
      // Labels sit beside their dot, away from the route, and flip inward near the map's edges.
      const label = (p, text, strong, preferEnd) => {
        const anchorEnd = p[0] < 70 ? false : p[0] > MAP_W - 70 ? true : preferEnd;
        return `<text x="${(p[0] + (anchorEnd ? -7 : 7)).toFixed(1)}" y="${(p[1] + 3).toFixed(1)}" text-anchor="${anchorEnd ? 'end' : 'start'}" class="${strong ? 'strong' : ''}">${escape(text)}</text>`;
      };
      const first = pts[0], last = pts[pts.length - 1];
      const westward = last[0] < first[0];
      return `
        <svg class="map" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="Route from ${escape(stops[0].name)} to ${escape(stops[stops.length - 1].name)}">
          <defs>
            <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="rgba(244,241,234,0.12)"/></pattern>
            <clipPath id="us"><path d="${land}"/></clipPath>
          </defs>
          <path class="land" d="${land}"/>
          <rect class="grid" width="${MAP_W}" height="${MAP_H}" clip-path="url(#us)"/>
          <polyline class="route-todo" points="${line(pts)}"/>
          <polyline class="route-done" points="${line(done)}"/>
          ${pts.slice(1, -1).map((p, i) => `<circle class="stop ${i + 1 <= progress ? 'passed' : ''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`).join('')}
          <circle class="stop passed" cx="${first[0].toFixed(1)}" cy="${first[1].toFixed(1)}" r="3.4"/>
          <circle class="end" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4"/>
          ${label(first, stops[0].name.split(',')[0], false, !westward)}
          ${label(last, stops[stops.length - 1].name.split(',')[0], true, westward)}
          <circle class="pulse" cx="${here[0].toFixed(1)}" cy="${here[1].toFixed(1)}" r="5"/>
          <circle cx="${here[0].toFixed(1)}" cy="${here[1].toFixed(1)}" r="4.4" fill="var(--amber)" stroke="#0e1016" stroke-width="1.6"/>
        </svg>`;
    }

    function renderTracking(data) {
      const tone = toneOf(data.statusLabel.toLowerCase().replace(' ', '_'));
      const scans = data.scans.map((scan) => `
        <li class="scan">
          <div class="when">${escape(scan.when)}</div>
          <div><span class="what">${escape(scan.label)}</span> <span class="where">· ${escape(scan.place)}</span></div>
        </li>`).join('');
      card.innerHTML = `
        ${mapSvg(data.stops, data.progress)}
        <div class="card-body">
          <div class="who">${escape(data.carrier)} · Order ${escape(data.orderNumber)}</div>
          <div class="track-head">
            <span class="pill ${tone}">${escape(data.statusLabel)}</span>
            <span class="track-no">${escape(data.trackingNumber)}</span>
          </div>
          <div class="eta">${escape(data.etaLabel)}</div>
          ${data.instructions ? `<div class="note" style="margin:0 0 12px">Leave it: <strong>${escape(data.instructions)}</strong></div>` : ''}
          <ol class="scans">${scans}</ol>
        </div>`;
    }

    // ── Live layer ─────────────────────────────────────────────────────
    const caps = document.querySelector('#caps');
    const modeEl = document.querySelector('#mode');
    const latencyEl = document.querySelector('#latency');
    const latLast = document.querySelector('#lat-last');
    const latAvg = document.querySelector('#lat-avg');
    const latencies = [];
    let lastAgentCap = null;

    function addCaption(role, text) {
      const el = document.createElement('div');
      el.className = `cap ${role === 'agent' ? 'agent' : 'caller'}`;
      el.textContent = text;
      caps.append(el);
      dismissHint();
      while (caps.children.length > 8) caps.firstElementChild.remove();
      if (role === 'agent') lastAgentCap = el;
    }

    function showLatency(ms) {
      latencies.push(ms);
      const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
      latLast.textContent = `${(ms / 1000).toFixed(2)}s`;
      latLast.className = ms < 1200 ? 'good' : ms < 2000 ? 'ok' : 'slow';
      latAvg.textContent = `${(avg / 1000).toFixed(2)}s`;
      latencyEl.classList.add('on');
    }

    function onCallEvent(event) {
      if (event.type === 'caption') addCaption(event.role, event.text);
      else if (event.type === 'latency') showLatency(event.responseMs);
      else if (event.type === 'interrupted') lastAgentCap?.classList.add('cut');
    }

    // Audio-reactive ring: amber for the agent's voice, cyan for the caller's.
    const viz = document.querySelector('#viz');
    const vctx = viz.getContext('2d');
    let audioCtx = null;
    const analysers = { agent: null, caller: null };
    function analyse(mediaStreamTrack, who) {
      audioCtx ??= new AudioContext();
      const source = audioCtx.createMediaStreamSource(new MediaStream([mediaStreamTrack]));
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.78;
      source.connect(analyser);
      analysers[who] = { analyser, bins: new Uint8Array(analyser.frequencyBinCount), level: 0 };
    }
    function levelOf(entry) {
      if (!entry) return 0;
      entry.analyser.getByteFrequencyData(entry.bins);
      let sum = 0;
      for (let i = 2; i < 48; i++) sum += entry.bins[i];
      entry.level += (sum / 46 / 255 - entry.level) * 0.35;
      return entry.level;
    }
    function draw(t) {
      const dpr = window.devicePixelRatio || 1;
      const w = viz.clientWidth * dpr, h = viz.clientHeight * dpr;
      if (viz.width !== w || viz.height !== h) { viz.width = w; viz.height = h; }
      vctx.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, base = Math.min(w, h) * 0.36;
      const agent = levelOf(analysers.agent), caller = levelOf(analysers.caller);
      const who = agent >= caller ? 'agent' : 'caller';
      const level = Math.max(agent, caller);
      const mode = level > 0.06 ? (who === 'agent' ? 'speaking' : 'listening') : 'idle';
      if (!modeEl.hidden && !callEnded) { modeEl.className = `mode ${mode}`; modeEl.textContent = mode === 'speaking' ? 'Speaking' : mode === 'listening' ? 'Hearing you' : 'Listening'; }
      const color = who === 'agent' ? [232, 161, 90] : [127, 208, 214];
      const bins = analysers[who]?.bins;
      for (let ring = 0; ring < 3; ring++) {
        vctx.beginPath();
        const points = 96;
        for (let i = 0; i <= points; i++) {
          const a = (i / points) * Math.PI * 2;
          const bin = bins ? bins[2 + ((i * 3 + ring * 7) % 44)] / 255 : 0;
          const wobble = Math.sin(a * (3 + ring) + t / (700 + ring * 260)) * 0.012;
          const r = base * (1 + ring * 0.07 + wobble + bin * level * (0.5 - ring * 0.12));
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          i === 0 ? vctx.moveTo(x, y) : vctx.lineTo(x, y);
        }
        vctx.strokeStyle = `rgba(${color.join(',')}, ${0.12 + level * (0.9 - ring * 0.25)})`;
        vctx.lineWidth = (2.2 - ring * 0.5) * dpr;
        vctx.shadowColor = `rgba(${color.join(',')}, 0.8)`;
        vctx.shadowBlur = 18 * level * dpr;
        vctx.stroke();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Once the call ends, the orb stops reacting and says so.
    let callEnded = false;
    function endCall() {
      if (callEnded) return;
      callEnded = true;
      analysers.agent = null;
      analysers.caller = null;
      modeEl.className = 'mode ended';
      modeEl.textContent = 'Call ended';
      document.querySelector('.orb-wrap').classList.add('ended');
    }

    function attach(track) {
      if (track.kind === Track.Kind.Video) {
        track.attach(video);
        video.classList.add('on');
        placeholder.classList.add('off');
        return;
      }
      if (track.kind === Track.Kind.Audio) {
        const element = track.attach();
        element.autoplay = true;
        document.body.append(element);
        analyse(track.mediaStreamTrack, 'agent');
      }
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      statusEl.textContent = 'Connecting';
      try {
        const session = await fetch('/session').then((response) => response.json());
        const room = new Room();
        let mic = null;
        // Register before connecting so a card can arrive on the first lookup.
        room.registerRpcMethod('show_card', async (data) => {
          showCard(JSON.parse(data.payload));
          return 'shown';
        });
        room.on(RoomEvent.TrackSubscribed, (track) => attach(track));
        room.on(RoomEvent.DataReceived, (payload, _participant, _kind, topic) => {
          if (topic !== 'sa-voice.events') return;
          try { onCallEvent(JSON.parse(new TextDecoder().decode(payload))); } catch {}
        });
        room.on(RoomEvent.Disconnected, () => {
          statusEl.textContent = 'Call ended';
          leaveBtn.hidden = true;
          endCall();
          mic?.stop();
        });
        // Microphone only. This page never opens a camera.
        // The browser's own echo and noise suppression stay on. The host
        // applies the speech model, so this page does not add another one.
        mic = await createLocalAudioTrack({
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        });
        await room.connect(session.liveKitUrl, session.token);
        await room.localParticipant.publishTrack(mic);
        analyse(mic.mediaStreamTrack, 'caller');
        await audioCtx?.resume();
        modeEl.hidden = false;
        statusEl.textContent = 'On the call';
        startBtn.hidden = true;
        hintLead.textContent = 'You’re live. Say an order number';
        leaveBtn.hidden = false;
        leaveBtn.onclick = () => room.disconnect();
      } catch (error) {
        statusEl.textContent = error instanceof Error ? error.message : 'Could not start the call';
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
